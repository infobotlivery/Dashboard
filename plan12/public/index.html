<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12 Semanas">
<link rel="manifest" href="manifest.webmanifest">

<title>Año de 12 Semanas</title>
<style>
:root{
  --bg:#f6f1f2; --card:#ffffff; --line:#e2d5d8; --ink:#1a1012; --muted:#6d6063;
  --wine:#7a1024; --red:#b3182f; --rose:#d9566c; --soft:#f5e3e6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#151012; --line:#2b2124; --ink:#f6f0f1; --muted:#9c8f92;
    --wine:#7a1024; --red:#d1243b; --rose:#ee7a8c; --soft:#2a1419;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#151012; --line:#2b2124; --ink:#f6f0f1; --muted:#9c8f92;
  --wine:#7a1024; --red:#d1243b; --rose:#ee7a8c; --soft:#2a1419;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}

header.top{margin-bottom:14px}
header.top h1{margin:0;font-size:34px;line-height:1.05;font-weight:300}
header.top h1 b{font-weight:700}
header.top p{margin:6px 0 0;color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.bar{flex:1;height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--wine),var(--red) 62%,var(--rose));transition:width .35s ease}
.prog span{font-size:14px;color:var(--muted);white-space:nowrap}
.focus{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14.5px}
.focus b{font-weight:600}
.star{margin:10px 0 0;font-size:15px}
.star b{font-weight:600}

.add{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
.add input{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.add select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px}
.btn.pri{background:linear-gradient(135deg,var(--wine),var(--red));border-color:transparent;color:#fff}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:12px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:10px 2px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button em{font-style:normal;display:block;font-size:12px;font-weight:500}
.tabs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--wine),var(--red));color:#fff}

.board{display:block}
.col{display:none}
.col.active{display:block}
.col h2{margin:0 0 4px;font-size:20px;font-weight:600}
.col .sub{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.col.hoy h2{color:var(--rose)}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:9px}
.card input[type=checkbox]{width:24px;height:24px;margin:1px 0 0;flex:none;accent-color:var(--red)}
.card .body{flex:1;min-width:0}
.card .t{font-size:15.5px;line-height:1.35;word-wrap:break-word}
.card.done .t{text-decoration:line-through;color:var(--muted)}
.card.starred{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chip.on{color:var(--rose);border-color:var(--rose)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink)}
.mini:hover{border-color:var(--rose)}
.mini.go{background:var(--soft);border-color:var(--rose)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-size:14.5px}
.foot{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
.wk button.nv{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
.wk div{text-align:center;flex:1}
.wk b{font-size:19px;font-weight:600;display:block}
.wk small{color:var(--muted)}
.wk .go{border:1px solid var(--rose);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin-top:6px}
.days button.today em::after{content:" •";color:var(--rose)}
.days button.today[aria-pressed="true"] em::after{color:#fff}
.dh{margin:18px 0 8px;font-size:15px;font-weight:600;color:var(--rose)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 10px}
.days button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;font-weight:600;font-size:14px;color:var(--muted)}
.days button em{font-style:normal;display:block;font-size:12px;font-weight:500}
.days button[aria-pressed="true"]{background:linear-gradient(135deg,var(--wine),var(--red));border-color:transparent;color:#fff}
.dh:first-of-type{margin-top:4px}
select.mini{padding:4px 8px;background:var(--card)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.panel{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 4px;font-size:22px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px}
.panel h4{margin:14px 0 6px;font-size:15px;font-weight:600}
.panel ul{margin:0;padding-left:18px;font-size:14.5px}
.panel li{margin:3px 0}
.panel label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
.panel textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px}
.panel .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.panel .row .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:80}
.hide{display:none!important}

@media (min-width:900px){
  .tabs{display:none}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .col{display:block}
  .overlay{align-items:center}
  .panel{border-radius:24px}
}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.sync{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:4px;white-space:nowrap}
</style>
</head>

var TKEY="plan12.token";
function normalize(){
  S.tasks.forEach(function(t){
    if(t.c==="hoy"){t.c="semana";if(t.d<0)t.d=todayIdx()}
    if(t.w===undefined)t.w=(t.c==="tareas")?0:4;
  });
  if(!S.tasks.some(function(t){return t.t==="El tema de Mateo Jiménez"}))S.tasks.push({id:"m1",t:"El tema de Mateo Jiménez",c:"semana",w:4,d:3,s:0,dd:null});
  if(!S.tasks.some(function(t){return t.w===3&&t.c==="hecho"})){DONE3.forEach(function(x,i){S.tasks.push({id:"h3_"+i,t:x,c:"hecho",w:3,d:-1,s:0,dd:"2026-10-25"})})}
  S.n=S.tasks.length+100;
}
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.tasks&&p.tasks.length)S.tasks=p.tasks;if(p&&p.closures)S.closures=p.closures;if(p&&p.rev)S.rev=p.rev}}catch(e){}
if(!S.tasks)S.tasks=seed();

var pushT=null,pushing=false,dirty=false;
function snapshot(){return {tasks:S.tasks,closures:S.closures,rev:S.rev}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(snapshot()))}catch(e){}}
function syncLabel(){return {ok:"Sincronizado",sync:"Guardando…",off:"Sin conexión: se guarda en este dispositivo",local:"Solo en este dispositivo"}[S.sync]||""}
function setSync(v){S.sync=v;var e=document.getElementById("sy");if(e)e.textContent=syncLabel()}
function token(){try{return localStorage.getItem(TKEY)||""}catch(e){return ""}}
function api(method,body){return fetch("api/state",{method:method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token()},body:body?JSON.stringify(body):undefined})}
function persist(){saveLocal();dirty=true;clearTimeout(pushT);pushT=setTimeout(push,600)}
function askToken(){
  $("#ov").innerHTML='<div class="panel"><h3>Código de acceso</h3><p>Escríbelo una vez en este dispositivo para sincronizar tu plan.</p><input id="tk" type="password" autocomplete="current-password" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:inherit;font-size:16px"><div class="row"><button class="btn pri" data-a="tok">Entrar</button></div></div>';
  $("#ov").classList.remove("hide");
}
function adopt(st,quiet){
  try{if(dirty||S.rev===0)localStorage.setItem(KEY+".bak",JSON.stringify(snapshot()))}catch(e){}
  S.tasks=st.tasks;S.closures=st.closures||{};S.rev=st.rev||0;dirty=false;normalize();saveLocal();render();setSync("ok");
  if(!quiet)toast("Se actualizó desde otro dispositivo");
}
function push(){
  if(pushing){pushT=setTimeout(push,400);return}
  pushing=true;setSync("sync");
  api("PUT",{baseRev:S.rev,tasks:S.tasks,closures:S.closures}).then(function(r){
    if(r.status===401){pushing=false;askToken();return}
    if(r.status===409){return r.json().then(function(j){pushing=false;adopt(j.state)})}
    if(!r.ok)throw new Error(r.status);
    return r.json().then(function(j){S.rev=j.rev;dirty=false;pushing=false;saveLocal();setSync("ok")});
  }).catch(function(){pushing=false;setSync("off")});
}
function pull(first){
  if(location.protocol.indexOf("http")!==0){setSync("local");return}
  api("GET").then(function(r){
    if(r.status===401){askToken();return}
    if(!r.ok)throw new Error(r.status);
    return r.json().then(function(j){
      if(!j.state||!j.state.tasks){dirty=true;push();return}
      if((j.state.rev||0)>S.rev){adopt(j.state,!dirty&&first)}
      else if(!dirty){setSync("ok")}
    });
  }).catch(function(){setSync("off")});
}

function isHoy(t){return t.c==="semana"&&t.w===S.week&&t.d===S.day}
function inCol(c){
  var T=S.tasks;
  if(c==="tareas")return T.filter(function(t){return t.c==="tareas"});
  if(c==="hoy")return T.filter(isHoy);
  if(c==="semana")return T.filter(function(t){return t.c==="semana"&&t.w===S.week&&!isHoy(t)}).sort(function(a,b){return a.d-b.d});
  return T.filter(function(t){return t.c==="hecho"&&t.w===S.week});
}

function move(id,to){
  var t=find(id);if(!t)return;
  if(to==="hoy"){t.c="semana";t.w=S.week;t.d=S.day;t.dd=null}
  else if(to==="semana"&&t.c==="semana"){t.d=-1;t.s=0}
  else if(to==="semana"){t.c="semana";if(!t.w)t.w=S.week;t.dd=null}
  else if(to==="tareas"){t.c="tareas";t.w=0;t.d=-1;t.s=0;t.dd=null}
  else if(to==="hecho"){t.c="hecho";t.dd=TODAY;if(!t.w)t.w=S.week}
  persist();render();
}

  $("#ov").classList.remove("hide");
}
function wstats(w){var l=S.tasks.filter(function(t){return t.w===w&&(t.c==="semana"||t.c==="hecho")});return {l:l,d:l.filter(function(t){return t.c==="hecho"}),p:l.filter(function(t){return t.c!=="hecho"}),pct:l.length?Math.round(l.filter(function(t){return t.c==="hecho"}).length*100/l.length):0}}
function wdiag(pct){return pct<85?"Por debajo de 85%: el problema es de ejecución, no de plan.":"Ejecución en meta. Si los resultados no llegan, hay que revisar el plan."}
function weekText(w,a,b,c){
  var s=wstats(w),cl=S.closures[w],o=["Cierre de la semana "+w+" ("+range(w)+")","","Ejecución: "+s.d.length+" de "+s.l.length+" tareas ("+s.pct+"%). Meta: 85%."];
  o.push("","Hechas:");s.d.forEach(function(t){o.push("- "+t.t)});if(!s.d.length)o.push("- ninguna");
  o.push("","Pendientes:");s.p.forEach(function(t){o.push("- "+t.t)});if(!s.p.length)o.push("- ninguna");
  o.push("","Qué funcionó: "+(a||"-"),"Qué trabó: "+(b||"-"),"Qué ajusto: "+(c||"-"),"","Diagnóstico: "+wdiag(s.pct));
  return o.join("\n");
}
function closeWeek(w){
  var s=wstats(w),cl=S.closures[w]||{};if(cl.pct!=null){s.pct=cl.pct}
  $("#ov").innerHTML='<div class="panel"><h3>Cierre de la semana '+w+'</h3><p>'+range(w)+'. Puntaje de ejecución: tareas hechas dividido tareas planeadas. La meta es 85%.</p>'
   +'<div style="font-size:42px;font-weight:700;line-height:1">'+s.pct+'%</div><div class="bar" style="margin:10px 0"><i style="width:'+s.pct+'%"></i></div>'
   +'<p>'+s.d.length+' de '+s.l.length+' tareas hechas. '+wdiag(s.pct)+'</p>'
   +'<h4>Pendientes ('+s.p.length+')</h4><ul>'+(s.p.length?s.p.map(function(t){return "<li>"+esc(t.t)+"</li>"}).join(""):"<li>Nada pendiente.</li>")+'</ul>'
   +'<label for="w1">¿Qué funcionó?</label><textarea id="w1">'+esc(cl.a||"")+'</textarea>'
   +'<label for="w2">¿Qué trabó?</label><textarea id="w2">'+esc(cl.b||"")+'</textarea>'
   +'<label for="w3">¿Qué ajusto la próxima semana?</label><textarea id="w3">'+esc(cl.c||"")+'</textarea>'
   +(s.p.length&&w<13?'<label style="display:flex;gap:10px;align-items:center;color:inherit;font-size:15px"><input type="checkbox" id="wm" checked> Pasar los '+s.p.length+' pendientes a la semana '+(w+1)+' (se copian: tu % de esta semana no cambia)</label>':'')
   +'<div class="row"><button class="btn" data-a="cpw" data-w="'+w+'">Copiar resumen</button><button class="btn pri" data-a="svw" data-w="'+w+'">Guardar cierre</button><button class="btn" data-a="shut">Cerrar</button></div></div>';
  $("#ov").classList.remove("hide");
}
function copyText(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;left:-999px;top:0";document.body.appendChild(ta);ta.focus();ta.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast("Copiado")},function(){toast("No pude copiar")});return}
  toast(ok?"Copiado":"No pude copiar");
}

document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-a='add']");if(!f)return;e.preventDefault();
  var v=$("#nt").value.trim();if(!v){toast("Escribe la tarea");return}
  var dv=+$("#nd").value;
  S.tasks.push(dv>=0?{id:"n"+(S.n++),t:v,c:"semana",w:S.week,d:dv,s:0,dd:null}:{id:"n"+(S.n++),t:v,c:"tareas",w:0,d:-1,s:0,dd:null});
  persist();render();
});
document.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset)return;var t=find(el.dataset.id);if(!t)return;
  if(el.dataset.a==="day"){
    t.d=+el.value;
    if(t.d>=0&&t.c==="tareas"){t.c="semana";if(!t.w)t.w=S.week}
    persist();render();
  }
  if(el.dataset.a==="wk"){
    t.w=+el.value;
    if(!t.w&&t.c!=="hecho"){t.c="tareas";t.d=-1;t.s=0}
    else if(t.w&&t.c==="tareas"){t.c="semana"}
    persist();render();
  }
});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,id=el.dataset.id;
  if(a==="tab"){S.tab=el.dataset.v;render();return}
  if(a==="pickday"){S.day=+el.dataset.v;S.tab="hoy";render();return}
  if(a==="pw"){S.week=Math.min(13,Math.max(1,S.week+(+el.dataset.v)));render();return}
  if(a==="gohoy"){S.week=currentWeek();S.day=todayIdx();S.tab="hoy";render();return}
  if(a==="chk"){var t=find(id);if(!t){render();return}move(id,t.c==="hecho"?"semana":"hecho");return}
  if(a==="mv"){move(id,el.dataset.to);return}
  if(a==="star"){var x=find(id);if(!x)return;var on=!x.s;S.tasks.forEach(function(k){if(k.w===x.w&&k.d===x.d)k.s=0});x.s=on?1:0;persist();render();return}
  if(a==="close"){closeDay();return}
  if(a==="closew"){closeWeek(S.week);return}
  if(a==="cpw"){copyText(weekText(+el.dataset.w,$("#w1").value.trim(),$("#w2").value.trim(),$("#w3").value.trim()));return}
  if(a==="svw"){
    var w=+el.dataset.w,s=wstats(w),mv=$("#wm"),moved=0;
    if(mv&&mv.checked){s.p.forEach(function(t){t.mv=w+1;S.tasks.push({id:"c"+(S.n++),t:t.t,c:"semana",w:w+1,d:-1,s:0,dd:null,fr:w});moved++})}
    S.closures[w]={pct:s.pct,done:s.d.length,tot:s.l.length,a:$("#w1").value.trim(),b:$("#w2").value.trim(),c:$("#w3").value.trim(),moved:moved,date:TODAY};
    persist();$("#ov").classList.add("hide");$("#ov").innerHTML="";render();
    toast(moved?"Cierre guardado. "+moved+" tareas pasaron a la semana "+(w+1):"Cierre guardado");return;
  }
  if(a==="tok"){var tv=$("#tk").value.trim();if(tv){try{localStorage.setItem(TKEY,tv)}catch(e){}$("#ov").classList.add("hide");$("#ov").innerHTML="";pull(true)}return}
  if(a==="shut"){$("#ov").classList.add("hide");$("#ov").innerHTML="";return}
  if(a==="copy"){copyText(summary($("#q1").value.trim(),$("#q2").value.trim()));return}
  if(a==="roll"){
    inCol("hoy").forEach(function(k){if(S.day<6){k.d=S.day+1}else{k.w=Math.min(13,S.week+1);k.d=0}k.s=0});
    persist();render();closeDay();toast("Lo pendiente pasó a mañana");return;
  }
});
render();
pull(true);
setInterval(function(){pull(false)},30000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pull(false)});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
